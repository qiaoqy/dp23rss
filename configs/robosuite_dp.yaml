_target_: diffusion_policy.workspace.train_diffusion_transformer_hybrid_workspace.TrainDiffusionTransformerHybridWorkspace

name: train_diffusion_transformer_hybrid
task_name: ${task.name}
exp_name: default

horizon: 16
n_obs_steps: 1  # now:1
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_cond: true

shape_meta: &shape_meta
  obs:
    all_state:
      shape: [24]  # for Stack/Unstack
#      shape: [22]  # for Assembly/DisAssembly
      type: low_dim
  action:
    shape: [4]

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_hybrid_image_policy.DiffusionTransformerHybridImagePolicy
  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100

  crop_shape: [76, 76]
  obs_encoder_group_norm: false
  eval_fixed_crop: false

  n_layer: 8
  n_cond_layers: 0
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  time_as_cond: true
  obs_as_cond: ${obs_as_cond}

  use_da: false
  en_freeze_obs_encoder: false
  load_parts_from_ckpt: all
  ffn_expand_factor: 4

task:
  name: robosuite_state
  shape_meta: ${shape_meta}

  root_dir: /mnt/dongxu-fs1/data-hdd/geyuan/code/trdrl25nips/robosuite
  env_name: Stack
  transition_file: ${task.env_name}_transitions_10trajectory_sparse.npy

  dataset:
    _target_: diffusion_policy.dataset.robosuite_state_dataset.RobosuiteStateDataset
    transition_path: ${task.root_dir}/generate/${task.transition_file}
    env_name: ${task.env_name}
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}
    pad_after: ${eval:'${n_action_steps}-1'}
    seed: 42
    val_ratio: 0.01
    return_meta: true
    strict_success_episode: true
    norm_input_output: false  # `false` is better for UnStack task

  # Rollout disabled (training still expects an env_runner object to instantiate)
  env_runner:
    _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 4
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: false

optimizer:
  learning_rate: 0.0001
  transformer_weight_decay: 0.01
  obs_encoder_weight_decay: 0.01
  betas: [0.9, 0.95]

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

pretrained_ckpt: "data/outputs/2026.04.18/17.43.30_train_diffusion_transformer_hybrid_robosuite_state/checkpoints/latest.ckpt"
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 200
  num_epochs: 5000
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: -1
  checkpoint_every: 500
  val_every: 100
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_debug
  resume: true
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.6f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
